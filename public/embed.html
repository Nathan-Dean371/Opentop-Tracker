<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenTop Bus Tracker - Embed</title>
    <link rel="stylesheet" href="/leaflet/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        
        #map {
            height: 100%;
            width: 100%;
        }
        
        .leaflet-popup-content {
            font-family: Arial, sans-serif;
        }
        
        .status {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
        }
        
        .status.active {
            background: #4caf50;
            color: white;
        }
        
        .status.stopped {
            background: #ff9800;
            color: white;
        }
        
        .status.inactive {
            background: #f44336;
            color: white;
        }
    </style>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div id="map"></div>
    
    <script src="/leaflet/leaflet.js"></script>
    <script>
        // Initialize map
        const map = L.map('map').setView([53.2707, -9.0568], 13);
        
        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        
        // Store markers and routes
        const busMarkers = {};
        let routeLayers = [];
        let stopMarkers = [];
        let buses = [];
        let stops = [];
        let routes = [];
        let assignments = {};
        const routeThemeColors = ['#4f46e5', '#0ea5e9', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#14b8a6', '#f97316'];
        const stopIconCache = new Map();

        function hashString(value) {
            return String(value || '')
                .split('')
                .reduce((hash, character) => ((hash << 5) - hash) + character.charCodeAt(0), 0);
        }

        function getRouteThemeColor(route, fallbackIndex = 0) {
            if (route && route.color) return route.color;
            const hash = Math.abs(hashString(route?.id || route?.name || fallbackIndex));
            return routeThemeColors[hash % routeThemeColors.length];
        }

        function getStopIcon(color) {
            if (stopIconCache.has(color)) {
                return stopIconCache.get(color);
            }

            const icon = L.icon({
                iconUrl: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
                        <circle cx="20" cy="20" r="17" fill="rgba(15, 23, 42, 0.10)" />
                        <circle cx="20" cy="20" r="16" fill="${color}" />
                        <circle cx="20" cy="20" r="11" fill="white" opacity="0.96" />
                        <circle cx="20" cy="20" r="5" fill="${color}" />
                        <circle cx="20" cy="20" r="16" fill="none" stroke="white" stroke-width="2" />
                    </svg>
                `),
                iconSize: [40, 40],
                iconAnchor: [20, 20],
                popupAnchor: [0, -18]
            });

            stopIconCache.set(color, icon);
            return icon;
        }
        
        // Custom bus icon (using data URI without btoa to avoid emoji encoding issues)
        const busIcon = L.icon({
            iconUrl: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40">
                    <circle cx="12" cy="12" r="11" fill="#FF5722" stroke="white" stroke-width="2"/>
                    <rect x="7" y="8" width="10" height="8" rx="1" fill="white"/>
                    <rect x="8" y="9" width="3" height="3" fill="#FF5722"/>
                    <rect x="13" y="9" width="3" height="3" fill="#FF5722"/>
                    <circle cx="9" cy="15" r="1" fill="#FF5722"/>
                    <circle cx="15" cy="15" r="1" fill="#FF5722"/>
                </svg>
            `),
            iconSize: [40, 40],
            iconAnchor: [20, 20],
            popupAnchor: [0, -20]
        });
        
        // Load routes
        async function loadRoutes() {
            try {
                const response = await fetch('/api/routes');
                routes = await response.json();
                
                // Clear existing route layers
                routeLayers.forEach(layer => map.removeLayer(layer));
                routeLayers = [];
                
                // Only display visible routes, using same styling as main map
                routes.filter(route => route.visible !== false).forEach((route, index) => {
                    const routeColor = getRouteThemeColor(route, index);
                    const outerRail = L.polyline(route.coordinates, {
                        color: routeColor,
                        weight: 11,
                        opacity: 0.14,
                        lineCap: 'round',
                        lineJoin: 'round'
                    });
                    const mainRail = L.polyline(route.coordinates, {
                        color: routeColor,
                        weight: 5,
                        opacity: 0.92,
                        lineCap: 'round',
                        lineJoin: 'round'
                    });
                    const layer = L.layerGroup([outerRail, mainRail]).addTo(map);
                    mainRail.bindPopup(`<b>${route.name}</b>`, { className: 'route-popup' });
                    routeLayers.push(layer);
                });
            } catch (error) {
                console.error('Error loading routes:', error);
            }
        }
        
        // Load stops
        async function loadStops() {
            try {
                const response = await fetch('/api/stops');
                stops = await response.json();
                
                // Clear existing stop markers
                stopMarkers.forEach(marker => map.removeLayer(marker));
                stopMarkers = [];

                // Only display stops whose routes are visible, using same styling as main map
                stops.forEach(stop => {
                    const route = routes.find(r => r.id === stop.routeId);
                    const routeColor = getRouteThemeColor(route || stop, stop.order || 0);
                    if (!route || route.visible !== false) {
                        const marker = L.marker([stop.lat, stop.lon], { icon: getStopIcon(routeColor) })
                            .addTo(map)
                            .bindPopup(`
                                <b>${stop.name}</b><br>
                                Route: ${route ? route.name : 'N/A'}<br>
                                Stop #${stop.order}
                            `, { className: 'stop-popup' });

                        stopMarkers.push(marker);
                    }
                });
            } catch (error) {
                console.error('Error loading stops:', error);
            }
        }
        
        // Load buses
        async function loadBuses() {
            try {
                const response = await fetch('/api/buses');
                buses = await response.json();
            } catch (error) {
                console.error('Error loading buses:', error);
            }
        }
        
        // Load assignments
        async function loadAssignments() {
            try {
                const response = await fetch('/api/assignments');
                assignments = await response.json();
            } catch (error) {
                console.error('Error loading assignments:', error);
            }
        }
        
        // Get ETA
        async function getETA(trackerId) {
            try {
                const response = await fetch(`/api/eta/${trackerId}`);
                if (response.ok) {
                    return await response.json();
                }
            } catch (error) {
                console.error('Error getting ETA:', error);
            }
            return null;
        }
        
        
        // Update bus locations
        async function updateBusLocations() {
            try {
                const response = await fetch('/api/locations');
                const locations = await response.json();
                
                for (const [deviceId, location] of Object.entries(locations)) {
                    const { lat, lon, timestamp, battery, velocity } = location;
                    
                    // Find bus info
                    const bus = buses.find(b => b.trackerId === deviceId);
                    const busName = bus ? `${bus.name} (${bus.number})` : `Bus ${deviceId}`;
                    
                    // Update or create marker
                    if (busMarkers[deviceId]) {
                        busMarkers[deviceId].setLatLng([lat, lon]);
                    } else {
                        busMarkers[deviceId] = L.marker([lat, lon], { icon: busIcon })
                            .addTo(map);
                        
                        // Center map on first bus
                        map.setView([lat, lon], 13);
                    }
                    
                    // Get ETA information
                    const etaData = await getETA(deviceId);
                    
                    // Update popup
                    const age = Math.floor(Date.now() / 1000 - timestamp);
                    const isActive = age < 300; // Active if updated in last 5 minutes
                    const isStopped = isActive && (velocity === undefined || velocity < 2); // Stopped if active but not moving
                    
                    let statusClass, statusText;
                    if (!isActive) {
                        statusClass = 'inactive';
                        statusText = 'Inactive';
                    } else if (isStopped) {
                        statusClass = 'stopped';
                        statusText = 'Stopped';
                    } else {
                        statusClass = 'active';
                        statusText = 'Active';
                    }
                    
                    let popupContent = `
                        <b>${busName}</b><br>
                        <span class="status ${statusClass}">${statusText}</span><br>
                        Battery: ${battery || 'N/A'}%<br>
                        Speed: ${velocity ? velocity.toFixed(1) : 'N/A'} km/h<br>
                        Updated: ${age}s ago
                    `;
                    
                    if (etaData) {
                        if (etaData.serviceState === 'waiting' && etaData.nextRun) {
                            const nextRun = etaData.nextRun;
                            const formatShortDuration = (seconds) => {
                                if (seconds == null) return '—';
                                const s = Math.max(0, Math.round(seconds));
                                const mins = Math.floor(s / 60);
                                const secs = s % 60;
                                if (mins > 0) return `${mins}m ${secs}s`;
                                return `${secs}s`;
                            };
                            popupContent += `<br><br><b>Next Run:</b><br>`;
                            popupContent += `${nextRun.time || '—'}<br>`;
                            if (nextRun.secondsUntil != null) {
                                popupContent += `Starts in: ${formatShortDuration(nextRun.secondsUntil)}`;
                            }
                        } else if (etaData.nextStop) {
                            const { nextStop } = etaData;
                            popupContent += `<br><br><b>Next Stop:</b>`;
                            if (nextStop.isManualOverride) {
                                popupContent += ` <span style="color: #ff9800; font-size: 11px;">(Manual)</span>`;
                            }
                            popupContent += `<br>`;
                            popupContent += `${nextStop.name}<br>`;
                            popupContent += `Distance: ${nextStop.distance}m<br>`;
                            if (nextStop.eta !== null) {
                                const etaMinutes = Math.floor(nextStop.eta / 60);
                                const etaSeconds = nextStop.eta % 60;
                                popupContent += `ETA: ${etaMinutes}m ${etaSeconds}s`;
                            } else {
                                popupContent += `ETA: Calculating...`;
                            }
                        }
                    }
                    
                    busMarkers[deviceId].bindPopup(popupContent);
                }
            } catch (error) {
                console.error('Error updating bus locations:', error);
            }
        }
        
        // Initial load
        async function initialize() {
            await loadRoutes();
            await loadStops();
            await loadBuses();
            await loadAssignments();
            await updateBusLocations();
        }
        
        initialize();
        
        // Update every 5 seconds
        setInterval(updateBusLocations, 5000);
    </script>
</body>
</html>
