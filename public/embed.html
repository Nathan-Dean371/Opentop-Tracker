<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenTop Bus Tracker - Embed</title>
    <link rel="stylesheet" href="/leaflet/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        
        #map {
            height: 100%;
            width: 100%;
        }
        
        .leaflet-popup-content {
            font-family: Arial, sans-serif;
        }
        
        .status {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
        }
        
        .status.active {
            background: #4caf50;
            color: white;
        }
        
        .status.inactive {
            background: #f44336;
            color: white;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <script src="/leaflet/leaflet.js"></script>
    <script>
        // Initialize map
        const map = L.map('map').setView([51.505, -0.09], 13);
        
        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        
        // Store markers
        const busMarkers = {};
        let routeLayer = null;
        
        // Custom bus icon (using data URI without btoa to avoid emoji encoding issues)
        const busIcon = L.icon({
            iconUrl: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(`
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40">
                    <circle cx="12" cy="12" r="11" fill="#FF5722" stroke="white" stroke-width="2"/>
                    <rect x="7" y="8" width="10" height="8" rx="1" fill="white"/>
                    <rect x="8" y="9" width="3" height="3" fill="#FF5722"/>
                    <rect x="13" y="9" width="3" height="3" fill="#FF5722"/>
                    <circle cx="9" cy="15" r="1" fill="#FF5722"/>
                    <circle cx="15" cy="15" r="1" fill="#FF5722"/>
                </svg>
            `),
            iconSize: [40, 40],
            iconAnchor: [20, 20],
            popupAnchor: [0, -20]
        });
        
        // Load routes
        async function loadRoutes() {
            try {
                const response = await fetch('/api/routes');
                const routes = await response.json();
                
                if (routeLayer) {
                    map.removeLayer(routeLayer);
                }
                
                routes.forEach(route => {
                    routeLayer = L.polyline(route.coordinates, {
                        color: '#3388ff',
                        weight: 4,
                        opacity: 0.6
                    }).addTo(map);
                });
            } catch (error) {
                console.error('Error loading routes:', error);
            }
        }
        
        // Update bus locations
        async function updateBusLocations() {
            try {
                const response = await fetch('/api/locations');
                const locations = await response.json();
                
                Object.entries(locations).forEach(([deviceId, location]) => {
                    const { lat, lon, timestamp, battery, velocity } = location;
                    
                    // Update or create marker
                    if (busMarkers[deviceId]) {
                        busMarkers[deviceId].setLatLng([lat, lon]);
                    } else {
                        busMarkers[deviceId] = L.marker([lat, lon], { icon: busIcon })
                            .addTo(map);
                        
                        // Center map on first bus
                        map.setView([lat, lon], 13);
                    }
                    
                    // Update popup
                    const age = Math.floor(Date.now() / 1000 - timestamp);
                    const isActive = age < 300; // Active if updated in last 5 minutes
                    
                    busMarkers[deviceId].bindPopup(`
                        <b>Bus ${deviceId}</b><br>
                        <span class="status ${isActive ? 'active' : 'inactive'}">${isActive ? 'Active' : 'Inactive'}</span><br>
                        Battery: ${battery || 'N/A'}%<br>
                        Speed: ${velocity ? (velocity * 3.6).toFixed(1) : 'N/A'} km/h<br>
                        Updated: ${age}s ago
                    `);
                });
            } catch (error) {
                console.error('Error updating bus locations:', error);
            }
        }
        
        // Initial load
        loadRoutes();
        updateBusLocations();
        
        // Update every 5 seconds
        setInterval(updateBusLocations, 5000);
    </script>
</body>
</html>
